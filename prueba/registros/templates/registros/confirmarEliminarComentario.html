{% extends "inicio/encabezado.html" %}
{% load static %}
{% block titulo %} Eliminar Comentario {% endblock %}

{% block contenido %}
    <div class="panel panel-default">
        <div class="panel-body">
            <p>¿Estás seguro que deseas eliminar el comentario de <strong>{{ comentario.usuario }}</strong>?</p>
            <form method="post" action="{% url 'eliminarComentario' comentario.id %}">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Sí, eliminar</button>
                <a href="{% url 'consultarComentario' %}" class="btn btn-default">Cancelar</a>
            </form>
        </div>
    </div>
{% endblock %}
