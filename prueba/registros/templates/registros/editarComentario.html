{% extends "inicio/encabezado.html" %}
{% load static %}
{% block titulo %} Editar Comentario {% endblock %}

{% block contenido %}
    <div class="panel panel-default">
        <div class="panel-body">
            <form method="post" action="{% url 'editarComentario' comentario.id %}">
                {% csrf_token %}
                <div class="form-group">
                    {{ form.usuario.label_tag }}
                    {{ form.usuario }}
                </div>
                <div class="form-group">
                    {{ form.mensaje.label_tag }}
                    {{ form.mensaje }}
                </div>
                <div class="form-actions text-right">
                    <button type="submit" class="btn btn-primary">Guardar</button>
                    <a href="{% url 'consultarComentario' %}" class="btn btn-default">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
{% endblock %}
