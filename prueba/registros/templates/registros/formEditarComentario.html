{% extends "inicio/encabezado.html" %}
{% load static %}
{% block titulo %} Editar Comentario {% endblock %}

{% block contenido %}
    <div class="panel panel-default">
        <div class="panel-body">
            <form class="form-horizontal" action="{% url 'Editar' comentario.id%}" method="POST" role="form">
                {% csrf_token %}
                <div class="form-group">
                    <label>Usuario</label>
                    <input value={{comentario.usuario}} name="usuario" type="text" class="form-control">
                </div>
                <div class="form-group">
                    <label>Mensaje</label>
                    <textarea name="mensaje" cols="50" rows="10" class="form-control">{{comentario.mensaje}} </textarea>
                </div>
                <div class="form-actions text-right">
                    <button type="submit" class="btn btn-primary">Guardar</button>
                    <a href="{% url 'consultarComentario' %}" class="btn btn-default">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
{% endblock %}
